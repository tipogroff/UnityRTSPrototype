behaviors:
  Stage7B_RTS_Student:
    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    behavioral_cloning:
      demo_path: Assets/Demonstrations/stage7b_teacher_replay_clean_smoke.demo
      strength: 0.5
      steps: 5000
      batch_size: 128
      num_epoch: 3
      samples_per_update: 0

    max_steps: 10000
    time_horizon: 64
    summary_freq: 500
    keep_checkpoints: 2
